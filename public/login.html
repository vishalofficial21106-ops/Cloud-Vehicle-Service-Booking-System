<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Cloud Vehicle Service Booking System</title>
  <!-- Google Fonts & Font Awesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-cloud"></i>
        </div>
        <span>Cloud<span class="highlight">Service</span></span>
      </a>

      <ul class="nav-menu" id="nav-menu"></ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="container-narrow">
    <div class="card" style="margin-top: 1.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 58px; height: 58px; border-radius: 50%; background: var(--primary-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem; box-shadow: 0 4px 15px rgba(37,99,235,0.4);">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 style="font-size: 1.85rem;">Welcome Back</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">
          Sign in to access your vehicle bookings or administrative console
        </p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div style="position: relative;">
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email" style="padding-left: 2.6rem;">
            <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          </div>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-left: 2.6rem;">
            <i class="fa-solid fa-key" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="login-submit-btn">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
        </button>
      </form>

      <!-- Quick Fill Demo Credentials Box for College Viva/Presentation -->
      <div class="demo-box">
        <h4><i class="fa-solid fa-wand-magic-sparkles"></i> College Presentation Quick-Fill:</h4>
        <div class="demo-buttons">
          <button type="button" class="btn btn-secondary btn-sm" id="fill-customer-btn">
            <i class="fa-solid fa-user"></i> Demo Customer
          </button>
          <button type="button" class="btn btn-secondary btn-sm" id="fill-admin-btn">
            <i class="fa-solid fa-shield-halved"></i> Demo Admin
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? 
        <a href="register.html" style="font-weight: 600; margin-left: 0.25rem;">Create an Account</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div>&copy; 2026 Cloud Vehicle Service Booking System</div>
      <div><a href="index.html">Back to Home</a></div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'customer-dashboard.html';
    }

    // Quick-Fill Handlers for easy presentation
    document.getElementById('fill-customer-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'demo@customer.com';
      document.getElementById('password').value = 'customer123';
      showToast('Filled Customer demo credentials', 'info');
    });

    document.getElementById('fill-admin-btn').addEventListener('click', () => {
      document.getElementById('email').value = 'admin@cloudservice.com';
      document.getElementById('password').value = 'admin123';
      showToast('Filled Admin demo credentials', 'info');
    });

    // Check URL params for feedback (e.g. registered=true)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      showToast('Registration successful! You can now log in.', 'success');
    }
    if (urlParams.get('expired') === 'true') {
      showToast('Your session has expired. Please sign in again.', 'info');
    }

    // Handle Form Submit
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('login-submit-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';

        const res = await API.post('/auth/login', { email, password });

        Auth.setAuth(res.token, res.user);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          const redirect = urlParams.get('redirect');
          if (redirect) {
            window.location.href = redirect;
          } else if (res.user.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'customer-dashboard.html';
          }
        }, 800);

      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account';
      }
    });
  </script>
</body>
</html>
